name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres and apply migrations
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,realtime,storage-api,edge-runtime,kong,postgrest
      - name: pgTAP
        run: supabase test db
